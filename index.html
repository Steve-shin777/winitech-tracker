<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위니텍 업무관리</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#eef0f3;
    --border:#e2e5ea;
    --ink:#161a20;
    --ink-2:#666e7a;
    --accent:#1f4fd6;
    --accent-weak:#e8edfc;
    --red:#c73a2f;
    --red-weak:#fbeae8;
    --orange:#b5680e;
    --orange-weak:#fbf0dd;
    --green:#177a4c;
    --green-weak:#e5f5ec;
    --gray:#7a808c;
    --gray-weak:#eceef1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",Pretendard,sans-serif;
  }
  .shell{max-width:1240px;margin:0 auto;padding:26px 22px 60px;}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;border-bottom:3px solid var(--ink);padding-bottom:14px;}
  .masthead h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .masthead .sub{color:var(--ink-2);font-size:12.5px;}
  .lock-status{font-size:12px;color:var(--ink-2);}
  .lock-status button{border:none;background:none;color:var(--accent);cursor:pointer;font-weight:700;font-size:12px;padding:0;margin-left:6px;}

  .primary-tabs{display:flex;gap:4px;margin:18px 0 20px;border-bottom:1px solid var(--border);}
  .ptab{padding:10px 16px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
  .ptab.active{color:var(--ink);border-bottom-color:var(--accent);}
  .panel{display:none;}
  .panel.active{display:block;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  @media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--surface);border:1px solid var(--border);padding:12px 14px;}
  .stat .l{font-size:11.5px;color:var(--ink-2);margin-bottom:4px;}
  .stat .v{font-size:20px;font-weight:800;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  input[type=text], input[type=date], input[type=tel], select, textarea{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 10px;font-size:13px;font-family:inherit;
  }
  textarea{resize:vertical;}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn.secondary{background:var(--surface);color:var(--ink);}
  .btn.small{padding:4px 9px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);background:var(--surface);}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.8px;}
  thead th{text-align:left;padding:9px 10px;font-size:11.5px;color:var(--ink-2);border-bottom:2px solid var(--ink);white-space:nowrap;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  .pill{display:inline-block;padding:2px 9px;font-size:11.5px;font-weight:700;border-radius:3px;white-space:nowrap;}
  .p-gray{background:var(--gray-weak);color:var(--gray);}
  .p-blue{background:var(--accent-weak);color:var(--accent);}
  .p-orange{background:var(--orange-weak);color:var(--orange);}
  .p-green{background:var(--green-weak);color:var(--green);}
  .p-red{background:var(--red-weak);color:var(--red);}
  .dday{font-weight:800;font-size:11.5px;}
  .muted{color:var(--ink-2);}
  .empty{text-align:center;padding:36px;color:var(--ink-2);}

  .modal-bg{position:fixed;inset:0;background:rgba(10,12,16,0.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:22px;border-top:4px solid var(--ink);}
  .modal h2{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--border);padding:4px 10px;font-size:12px;cursor:pointer;user-select:none;}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;z-index:100;display:none;}
  .toast.show{display:block;}
  .toast.err{background:var(--red);}

  .pin-bg{position:fixed;inset:0;background:rgba(10,12,16,0.5);display:none;align-items:center;justify-content:center;z-index:70;padding:16px;}
  .pin-bg.open{display:flex;}
  .pin-box{background:var(--surface);padding:24px;max-width:320px;width:100%;border-top:4px solid var(--ink);}
  .pin-box h3{margin:0 0 10px;font-size:15px;}
  .pin-box p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);}
  .pin-box input{width:100%;margin-bottom:10px;}
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div>
      <h1>위니텍 업무관리</h1>
      <div class="sub">수주관리 · 투입인력을 한 곳에서 조회·관리합니다.</div>
    </div>
    <div class="lock-status" id="lockStatus">조회 전용<button id="unlockBtn" type="button">담당자 로그인</button></div>
  </div>

  <div class="primary-tabs">
    <div class="ptab active" data-panel="bidsPanel">수주관리</div>
    <div class="ptab" data-panel="personnelPanel">투입인력</div>
  </div>

  <!-- ================= 수주관리 ================= -->
  <div class="panel active" id="bidsPanel">
    <div class="stats">
      <div class="stat"><div class="l">신규발굴</div><div class="v" id="bidStatDiscover">–</div></div>
      <div class="stat"><div class="l">진행중</div><div class="v" id="bidStatProgress">–</div></div>
      <div class="stat"><div class="l">수주(누적)</div><div class="v" id="bidStatWon">–</div></div>
      <div class="stat"><div class="l">수주율</div><div class="v" id="bidStatRate">–</div></div>
    </div>
    <div class="toolbar">
      <div class="tabs" id="bidTabs">
        <div class="tab active" data-f="all">전체</div>
        <div class="tab" data-f="발굴">신규발굴</div>
        <div class="tab" data-f="progress">진행중</div>
        <div class="tab" data-f="history">수주이력</div>
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="bidSearch" placeholder="사업명·발주처 검색">
        <button class="btn" id="bidAddBtn" type="button">+ 새 건 추가</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>순번</th><th>참여형태</th><th>주사업자/부사업자</th><th>회사명</th><th>사업명</th>
          <th>계약금액(만원)</th><th>발주처</th><th>단계</th><th>결과</th><th>마감/결과일</th><th>담당자</th><th>비고</th><th></th>
        </tr></thead>
        <tbody id="bidTbody"><tr><td colspan="13" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- ================= 투입인력 ================= -->
  <div class="panel" id="personnelPanel">
    <div class="toolbar">
      <div class="tabs" id="pplTabs">
        <div class="tab active" data-f="all">전체</div>
        <div class="tab" data-f="가용">가용만</div>
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="pplSearch" placeholder="이름·전문분야 검색">
        <button class="btn" id="pplAddBtn" type="button">+ 인력 추가</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>이름</th><th>소속회사</th><th>직급</th><th>전문분야</th><th>보유자격증</th>
          <th>경력연차</th><th>투입가능여부</th><th>현재투입사업</th><th>연락처</th><th>PPT링크</th><th>비고</th><th></th>
        </tr></thead>
        <tbody id="pplTbody"><tr><td colspan="12" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============ 수주 modal ============ -->
<div class="modal-bg" id="bidModalBg">
  <div class="modal">
    <h2 id="bidModalTitle">새 건 추가</h2>
    <input type="hidden" id="bid_id">
    <div class="grid2">
      <div class="field"><label>순번</label><input type="text" id="bid_seq"></div>
      <div class="field"><label>참여형태</label>
        <select id="bid_participation"><option value="단독">단독</option><option value="컨소시엄">컨소시엄</option></select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>주/부사업자</label>
        <select id="bid_role"><option value="">-</option><option value="주사업자">주사업자</option><option value="부사업자">부사업자</option></select>
      </div>
      <div class="field"><label>회사명</label><input type="text" id="bid_company"></div>
    </div>
    <div class="field"><label>사업명 *</label><input type="text" id="bid_name"></div>
    <div class="grid2">
      <div class="field"><label>계약금액(만원)</label><input type="text" id="bid_amount" placeholder="예: 45000"></div>
      <div class="field"><label>발주처</label><input type="text" id="bid_client"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>단계</label>
        <select id="bid_stage">
          <option value="발굴">신규발굴</option><option value="준비중">준비중</option>
          <option value="제출완료">제출완료</option><option value="수주">수주</option><option value="탈락">탈락</option>
        </select>
      </div>
      <div class="field"><label>결과</label>
        <select id="bid_result"><option value="">-</option><option value="수주">수주</option><option value="실주">실주</option><option value="드랍">드랍</option></select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label id="bid_dateLabel">마감/결과일</label><input type="date" id="bid_date"></div>
      <div class="field"><label>담당자</label><input type="text" id="bid_manager" value="신성현"></div>
    </div>
    <div class="field"><label>비고</label><textarea id="bid_note" rows="3"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" id="bid_deleteBtn" type="button" style="display:none;">삭제</button>
      <div style="display:flex;gap:8px;margin-left:auto;">
        <button class="btn secondary" id="bid_cancelBtn" type="button">취소</button>
        <button class="btn" id="bid_saveBtn" type="button">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 인력 modal ============ -->
<div class="modal-bg" id="pplModalBg">
  <div class="modal">
    <h2 id="pplModalTitle">인력 추가</h2>
    <input type="hidden" id="ppl_id">
    <div class="grid2">
      <div class="field"><label>이름 *</label><input type="text" id="ppl_name"></div>
      <div class="field"><label>소속회사</label><input type="text" id="ppl_company"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>직급</label>
        <select id="ppl_rank">
          <option>사원</option><option>대리</option><option>과장</option><option>차장</option>
          <option>부장</option><option>이사</option><option>상무</option><option>전무</option>
        </select>
      </div>
      <div class="field"><label>경력연차</label><input type="text" id="ppl_years"></div>
    </div>
    <div class="field"><label>전문분야 (복수 선택)</label>
      <div class="chip-row" id="ppl_specialty" data-options="PM/PMO,네트워크,보안,개발,인프라,데이터/AI,감리"></div>
    </div>
    <div class="field"><label>보유자격증 (복수 선택)</label>
      <div class="chip-row" id="ppl_certs" data-options="정보시스템감리원,정보통신감리원,PMP,정보보안기사,네트워크관리사,기술사"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>투입가능여부</label>
        <select id="ppl_avail"><option value="가용">가용</option><option value="투입중">투입중</option><option value="휴직/이탈">휴직/이탈</option></select>
      </div>
      <div class="field"><label>현재투입사업</label><input type="text" id="ppl_project"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>연락처</label><input type="text" id="ppl_contact" placeholder="010-0000-0000"></div>
      <div class="field"><label>PPT 링크 (구글드라이브 등)</label><input type="text" id="ppl_ppt" placeholder="https://..."></div>
    </div>
    <div class="field"><label>비고</label><textarea id="ppl_note" rows="3"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" id="ppl_deleteBtn" type="button" style="display:none;">삭제</button>
      <div style="display:flex;gap:8px;margin-left:auto;">
        <button class="btn secondary" id="ppl_cancelBtn" type="button">취소</button>
        <button class="btn" id="ppl_saveBtn" type="button">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ PIN modal ============ -->
<div class="pin-bg" id="pinBg">
  <div class="pin-box">
    <h3>담당자 로그인</h3>
    <p>등록·수정·삭제는 담당자 PIN이 필요합니다.</p>
    <input type="text" id="pinInput" placeholder="PIN 입력">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn secondary" id="pinCancelBtn" type="button">취소</button>
      <button class="btn" id="pinSubmitBtn" type="button">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== Firebase init ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCwHhUCJm5SnUdL8EEqvyQ4rAeQtkFHyoA",
  authDomain: "winitech-task-management.firebaseapp.com",
  projectId: "winitech-task-management",
  storageBucket: "winitech-task-management.firebasestorage.app",
  messagingSenderId: "975272075851",
  appId: "1:975272075851:web:c45bf971ff56259ed823ce"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ====== PIN (아래 값을 원하시는 값으로 바꾸세요) ====== */
const ADMIN_PIN = "WINITECH2026";
let unlocked = sessionStorage.getItem("wt_unlocked") === "1";

const $ = id => document.getElementById(id);

function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.className = "toast", 3000);
}

function refreshLockUI(){
  $("lockStatus").innerHTML = unlocked
    ? '담당자 모드<button id="unlockBtn" type="button">로그아웃</button>'
    : '조회 전용<button id="unlockBtn" type="button">담당자 로그인</button>';
  $("unlockBtn").addEventListener("click", ()=>{
    if(unlocked){ unlocked = false; sessionStorage.removeItem("wt_unlocked"); refreshLockUI(); toast("조회 전용으로 전환했습니다."); }
    else { $("pinBg").classList.add("open"); $("pinInput").value=""; $("pinInput").focus(); }
  });
  $("bidAddBtn").style.display = unlocked ? "inline-block" : "none";
  $("pplAddBtn").style.display = unlocked ? "inline-block" : "none";
}
$("pinCancelBtn").addEventListener("click", ()=> $("pinBg").classList.remove("open"));
$("pinSubmitBtn").addEventListener("click", ()=>{
  if($("pinInput").value === ADMIN_PIN){
    unlocked = true; sessionStorage.setItem("wt_unlocked","1");
    $("pinBg").classList.remove("open"); refreshLockUI(); toast("담당자 모드로 전환했습니다.");
  } else { toast("PIN이 올바르지 않습니다.", true); }
});
refreshLockUI();

/* ====== primary tabs ====== */
document.querySelectorAll(".ptab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".ptab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    $(t.getAttribute("data-panel")).classList.add("active");
  });
});

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){
  if(!d) return "-";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+String(dt.getDate()).padStart(2,"0");
}

/* =========================================================
   수주관리
   ========================================================= */
let bidDocs = [];
let bidFilter = "all";

const STAGE_PILL = {"발굴":"p-gray","준비중":"p-blue","제출완료":"p-orange","수주":"p-green","탈락":"p-red"};
const RESULT_PILL = {"수주":"p-green","실주":"p-red","드랍":"p-gray"};

function ddayInfo(dateStr, stage){
  if(!dateStr || stage==="수주" || stage==="탈락") return {text: fmtDate(dateStr), cls:""};
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+"T00:00:00");
  const diff = Math.round((target-today)/86400000);
  let cls="muted", tag;
  if(diff<0){ cls="dday"; tag = "D+"+Math.abs(diff); }
  else if(diff===0){ cls="dday"; tag="D-DAY"; }
  else if(diff<=7){ cls="dday"; tag="D-"+diff; }
  else { tag="D-"+diff; }
  return {text: fmtDate(dateStr)+" ("+tag+")", cls};
}

function bidPassFilter(d){
  if(bidFilter==="all") return true;
  if(bidFilter==="발굴") return d.stage==="발굴";
  if(bidFilter==="progress") return d.stage==="준비중"||d.stage==="제출완료";
  if(bidFilter==="history") return d.stage==="수주"||d.stage==="탈락";
  return true;
}

function renderBids(){
  const q = $("bidSearch").value.trim().toLowerCase();
  let rows = bidDocs.filter(d => bidPassFilter(d) && (!q || (d.name||"").toLowerCase().includes(q) || (d.client||"").toLowerCase().includes(q)));
  rows.sort((a,b)=>{
    const aH = a.stage==="수주"||a.stage==="탈락", bH = b.stage==="수주"||b.stage==="탈락";
    if(aH!==bH) return aH?1:-1;
    const ad=a.deadline||"9999", bd=b.deadline||"9999";
    return aH ? bd.localeCompare(ad) : ad.localeCompare(bd);
  });
  const tbody = $("bidTbody");
  if(rows.length===0){
    tbody.innerHTML = '<tr><td colspan="13" class="empty">해당하는 항목이 없습니다.</td></tr>';
  } else {
    tbody.innerHTML = rows.map(d=>{
      const dd = ddayInfo(d.deadline, d.stage);
      const amt = d.amount ? Number(d.amount).toLocaleString() : "-";
      return `<tr>
        <td>${esc(d.seq||"-")}</td>
        <td>${d.participation ? `<span class="pill ${d.participation==='컨소시엄'?'p-blue':'p-gray'}">${esc(d.participation)}</span>` : "-"}</td>
        <td>${esc(d.role||"-")}</td>
        <td>${esc(d.company||"-")}</td>
        <td><strong>${esc(d.name)}</strong></td>
        <td>${amt}</td>
        <td class="muted">${esc(d.client||"-")}</td>
        <td>${d.stage ? `<span class="pill ${STAGE_PILL[d.stage]||''}">${esc(d.stage)}</span>` : "-"}</td>
        <td>${d.result ? `<span class="pill ${RESULT_PILL[d.result]||''}">${esc(d.result)}</span>` : "-"}</td>
        <td class="${dd.cls}">${dd.text}</td>
        <td>${esc(d.manager||"-")}</td>
        <td class="muted">${esc(d.note||"-")}</td>
        <td><button class="btn small secondary" data-edit="${d.id}" type="button">${unlocked?"수정":"보기"}</button></td>
      </tr>`;
    }).join("");
    tbody.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=> openBidModal(b.getAttribute("data-edit"))));
  }
  const discover = bidDocs.filter(d=>d.stage==="발굴").length;
  const progress = bidDocs.filter(d=>d.stage==="준비중"||d.stage==="제출완료").length;
  const won = bidDocs.filter(d=>d.stage==="수주");
  const lost = bidDocs.filter(d=>d.stage==="탈락").length;
  $("bidStatDiscover").textContent = discover;
  $("bidStatProgress").textContent = progress;
  $("bidStatWon").textContent = won.length;
  const denom = won.length+lost;
  $("bidStatRate").textContent = denom>0 ? Math.round(won.length/denom*100)+"%" : "-";
}

$("bidTabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll("#bidTabs .tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); bidFilter = t.getAttribute("data-f"); renderBids();
});
$("bidSearch").addEventListener("input", renderBids);

function openBidModal(id){
  if(!unlocked && id){ /* view only, still show read-only modal */ }
  if(!unlocked && !id){ toast("담당자 로그인이 필요합니다.", true); return; }
  $("bid_id").value = id||"";
  const d = id ? bidDocs.find(x=>x.id===id) : null;
  $("bidModalTitle").textContent = id ? "건 수정" : "새 건 추가";
  $("bid_seq").value = d ? (d.seq||"") : (bidDocs.length+1);
  $("bid_participation").value = d ? (d.participation||"단독") : "단독";
  $("bid_role").value = d ? (d.role||"") : "";
  $("bid_company").value = d ? (d.company||"") : "";
  $("bid_name").value = d ? (d.name||"") : "";
  $("bid_amount").value = d ? (d.amount||"") : "";
  $("bid_client").value = d ? (d.client||"") : "";
  $("bid_stage").value = d ? (d.stage||"발굴") : "발굴";
  $("bid_result").value = d ? (d.result||"") : "";
  $("bid_date").value = d ? (d.deadline||"") : "";
  $("bid_manager").value = d ? (d.manager||"신성현") : "신성현";
  $("bid_note").value = d ? (d.note||"") : "";
  $("bid_deleteBtn").style.display = (id && unlocked) ? "inline-block" : "none";
  setBidFormDisabled(!unlocked);
  $("bidModalBg").classList.add("open");
}
function setBidFormDisabled(disabled){
  ["bid_seq","bid_participation","bid_role","bid_company","bid_name","bid_amount","bid_client","bid_stage","bid_result","bid_date","bid_manager","bid_note"]
    .forEach(id=> $(id).disabled = disabled);
  $("bid_saveBtn").style.display = disabled ? "none" : "inline-block";
}
$("bid_cancelBtn").addEventListener("click", ()=> $("bidModalBg").classList.remove("open"));
$("bidAddBtn").addEventListener("click", ()=> openBidModal(null));

$("bid_saveBtn").addEventListener("click", async ()=>{
  const name = $("bid_name").value.trim();
  if(!name){ toast("사업명을 입력해주세요.", true); return; }
  const id = $("bid_id").value;
  const body = {
    seq: $("bid_seq").value.trim(),
    participation: $("bid_participation").value,
    role: $("bid_role").value,
    company: $("bid_company").value.trim(),
    name,
    amount: $("bid_amount").value.trim(),
    client: $("bid_client").value.trim(),
    stage: $("bid_stage").value,
    result: $("bid_result").value,
    deadline: $("bid_date").value,
    manager: $("bid_manager").value.trim(),
    note: $("bid_note").value.trim(),
    pin: ADMIN_PIN,
    updatedAt: new Date().toISOString()
  };
  try{
    if(id) await db.collection("bids").doc(id).set(body, {merge:true});
    else { body.createdAt = body.updatedAt; await db.collection("bids").add(body); }
    toast(id?"수정되었습니다.":"추가되었습니다.");
    $("bidModalBg").classList.remove("open");
  }catch(e){ toast("저장 실패: "+e.message, true); }
});
$("bid_deleteBtn").addEventListener("click", async ()=>{
  const id = $("bid_id").value; if(!id) return;
  if(!confirm("삭제할까요? 되돌릴 수 없습니다.")) return;
  try{ await db.collection("bids").doc(id).delete(); toast("삭제되었습니다."); $("bidModalBg").classList.remove("open"); }
  catch(e){ toast("삭제 실패: "+e.message, true); }
});

db.collection("bids").onSnapshot(snap=>{
  bidDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderBids();
}, err=>{ $("bidTbody").innerHTML = `<tr><td colspan="13" class="empty">연결 오류: ${esc(err.message)}</td></tr>`; });

/* =========================================================
   투입인력
   ========================================================= */
let pplDocs = [];
let pplFilter = "all";

function initChips(containerId){
  const el = $(containerId);
  const opts = el.getAttribute("data-options").split(",");
  el.innerHTML = opts.map(o=>`<div class="chip" data-v="${esc(o)}">${esc(o)}</div>`).join("");
  el.querySelectorAll(".chip").forEach(c=> c.addEventListener("click", ()=>{
    if(el.dataset.locked==="1") return;
    c.classList.toggle("on");
  }));
}
initChips("ppl_specialty");
initChips("ppl_certs");
function getChipValues(containerId){
  return Array.from($(containerId).querySelectorAll(".chip.on")).map(c=>c.getAttribute("data-v"));
}
function setChipValues(containerId, values){
  values = values||[];
  $(containerId).querySelectorAll(".chip").forEach(c=> c.classList.toggle("on", values.includes(c.getAttribute("data-v"))));
}

function pplPassFilter(d){
  if(pplFilter==="all") return true;
  if(pplFilter==="가용") return d.avail==="가용";
  return true;
}

function renderPpl(){
  const q = $("pplSearch").value.trim().toLowerCase();
  let rows = pplDocs.filter(d=> pplPassFilter(d) && (!q || (d.name||"").toLowerCase().includes(q) || (d.specialty||[]).join(",").toLowerCase().includes(q)));
  const tbody = $("pplTbody");
  if(rows.length===0){
    tbody.innerHTML = '<tr><td colspan="12" class="empty">해당하는 인력이 없습니다.</td></tr>';
  } else {
    const availPill = {"가용":"p-green","투입중":"p-orange","휴직/이탈":"p-gray"};
    tbody.innerHTML = rows.map(d=>`<tr>
      <td><strong>${esc(d.name)}</strong></td>
      <td>${esc(d.company||"-")}</td>
      <td>${esc(d.rank||"-")}</td>
      <td>${(d.specialty||[]).map(s=>`<span class="pill p-blue">${esc(s)}</span>`).join(" ")||"-"}</td>
      <td>${(d.certs||[]).map(s=>`<span class="pill p-gray">${esc(s)}</span>`).join(" ")||"-"}</td>
      <td>${esc(d.years||"-")}</td>
      <td>${d.avail ? `<span class="pill ${availPill[d.avail]||''}">${esc(d.avail)}</span>` : "-"}</td>
      <td class="muted">${esc(d.project||"-")}</td>
      <td>${esc(d.contact||"-")}</td>
      <td>${d.ppt ? `<a href="${esc(d.ppt)}" target="_blank" rel="noopener">열기</a>` : "-"}</td>
      <td class="muted">${esc(d.note||"-")}</td>
      <td><button class="btn small secondary" data-edit="${d.id}" type="button">${unlocked?"수정":"보기"}</button></td>
    </tr>`).join("");
    tbody.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=> openPplModal(b.getAttribute("data-edit"))));
  }
}
$("pplTabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll("#pplTabs .tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); pplFilter = t.getAttribute("data-f"); renderPpl();
});
$("pplSearch").addEventListener("input", renderPpl);

function openPplModal(id){
  if(!unlocked && !id){ toast("담당자 로그인이 필요합니다.", true); return; }
  $("ppl_id").value = id||"";
  const d = id ? pplDocs.find(x=>x.id===id) : null;
  $("pplModalTitle").textContent = id ? "인력 수정" : "인력 추가";
  $("ppl_name").value = d ? (d.name||"") : "";
  $("ppl_company").value = d ? (d.company||"") : "";
  $("ppl_rank").value = d ? (d.rank||"사원") : "사원";
  $("ppl_years").value = d ? (d.years||"") : "";
  setChipValues("ppl_specialty", d ? d.specialty : []);
  setChipValues("ppl_certs", d ? d.certs : []);
  $("ppl_avail").value = d ? (d.avail||"가용") : "가용";
  $("ppl_project").value = d ? (d.project||"") : "";
  $("ppl_contact").value = d ? (d.contact||"") : "";
  $("ppl_ppt").value = d ? (d.ppt||"") : "";
  $("ppl_note").value = d ? (d.note||"") : "";
  $("ppl_deleteBtn").style.display = (id && unlocked) ? "inline-block" : "none";
  setPplFormDisabled(!unlocked);
  $("pplModalBg").classList.add("open");
}
function setPplFormDisabled(disabled){
  ["ppl_name","ppl_company","ppl_rank","ppl_years","ppl_avail","ppl_project","ppl_contact","ppl_ppt","ppl_note"]
    .forEach(id=> $(id).disabled = disabled);
  $("ppl_specialty").dataset.locked = disabled ? "1" : "0";
  $("ppl_certs").dataset.locked = disabled ? "1" : "0";
  $("ppl_saveBtn").style.display = disabled ? "none" : "inline-block";
}
$("ppl_cancelBtn").addEventListener("click", ()=> $("pplModalBg").classList.remove("open"));
$("pplAddBtn").addEventListener("click", ()=> openPplModal(null));

$("ppl_saveBtn").addEventListener("click", async ()=>{
  const name = $("ppl_name").value.trim();
  if(!name){ toast("이름을 입력해주세요.", true); return; }
  const id = $("ppl_id").value;
  const body = {
    name,
    company: $("ppl_company").value.trim(),
    rank: $("ppl_rank").value,
    years: $("ppl_years").value.trim(),
    specialty: getChipValues("ppl_specialty"),
    certs: getChipValues("ppl_certs"),
    avail: $("ppl_avail").value,
    project: $("ppl_project").value.trim(),
    contact: $("ppl_contact").value.trim(),
    ppt: $("ppl_ppt").value.trim(),
    note: $("ppl_note").value.trim(),
    pin: ADMIN_PIN,
    updatedAt: new Date().toISOString()
  };
  try{
    if(id) await db.collection("personnel").doc(id).set(body, {merge:true});
    else { body.createdAt = body.updatedAt; await db.collection("personnel").add(body); }
    toast(id?"수정되었습니다.":"추가되었습니다.");
    $("pplModalBg").classList.remove("open");
  }catch(e){ toast("저장 실패: "+e.message, true); }
});
$("ppl_deleteBtn").addEventListener("click", async ()=>{
  const id = $("ppl_id").value; if(!id) return;
  if(!confirm("삭제할까요? 되돌릴 수 없습니다.")) return;
  try{ await db.collection("personnel").doc(id).delete(); toast("삭제되었습니다."); $("pplModalBg").classList.remove("open"); }
  catch(e){ toast("삭제 실패: "+e.message, true); }
});

db.collection("personnel").onSnapshot(snap=>{
  pplDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderPpl();
}, err=>{ $("pplTbody").innerHTML = `<tr><td colspan="12" class="empty">연결 오류: ${esc(err.message)}</td></tr>`; });
</script>
